# =============================================================================
# FlowWatch — Mosquitto ACL Rules
# ARCHITECTURE.md §4: three credential scopes, least-privilege
# Topic pattern: flowwatch/{unit_id}/{category}/{name}  (SCHEMA.md §1)
# =============================================================================

# ── Device: unit1 ───────────────────────────────────────────────────────
# Scoped to its own unit only — never another unit's topics.
user device_unit1
topic write flowwatch/unit1/sensor/#
topic write flowwatch/unit1/status/#
topic write flowwatch/unit1/alert/#
topic read flowwatch/unit1/control/#

# ── Device: unit2 ───────────────────────────────────────────────────────
user device_unit2
topic write flowwatch/unit2/sensor/#
topic write flowwatch/unit2/status/#
topic write flowwatch/unit2/alert/#
topic read flowwatch/unit2/control/#

# ── Dashboard (fleet-wide) ─────────────────────────────────────────────
# Single shared credential, fleet-wide — PRD.md §5 (no per-user scoping)
# Can publish control commands to any unit, can subscribe to everything.
user dashboard
topic write flowwatch/+/control/#
topic read flowwatch/#

# ── Node-RED (internal, read-only bridge) ──────────────────────────────
# ARCHITECTURE.md §1: "none (read-only bridge)"
# Subscribes to all topics for routing into InfluxDB/MySQL.
user nodered
topic read flowwatch/#

# ── Broker health check (internal) ─────────────────────────────────────
# Used only by the Docker healthcheck (docker-compose.yml) — $SYS read only.
user health
topic read $SYS/#
