# =============================================================================
# FlowWatch — Mosquitto Broker Configuration
# ARCHITECTURE.md §4: TLS, ACLs, WebSocket bridge
# =============================================================================

# ── Plain MQTT (local development only) ─────────────────────────────────
# Disable this listener in production — use TLS (8883) instead.
listener 1883
protocol mqtt

# ── TLS-encrypted MQTT (production — devices connect here) ──────────────
# Uncomment when deploying to VPS with generated/real certificates.
# listener 8883
# protocol mqtt
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key

# ── WebSocket (dashboard connects here) ─────────────────────────────────
# ARCHITECTURE.md §2: Dashboard → WebSocket (9001) → Mosquitto
listener 9001
protocol websockets

# ── Authentication ──────────────────────────────────────────────────────
# PRD.md NFR: "Dashboard client never holds broker admin credentials"
allow_anonymous false
password_file /mosquitto/config/passwd

# ── Authorization ───────────────────────────────────────────────────────
# ARCHITECTURE.md §4: three credential scopes, least-privilege
acl_file /mosquitto/config/acl.conf

# ── Persistence ─────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ─────────────────────────────────────────────────────────────
log_dest stdout
log_type warning
log_type error
log_type notice
log_type information
connection_messages true
