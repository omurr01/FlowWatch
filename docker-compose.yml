# FlowWatch — Docker Compose (Sprint 0)
# ARCHITECTURE.md §3: all cloud services on a single VPS / dev machine
# Run setup.ps1 FIRST to generate the Mosquitto password file.

services:

  # ── MQTT Broker ──────────────────────────────────────────────────────────
  # ARCHITECTURE.md §1: transport between device, dashboard, and Node-RED
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: flowwatch-mosquitto
    ports:
      - "1883:1883"   # Plain MQTT (local dev — disable in production)
      - "9001:9001"   # WebSocket (dashboard connects here)
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    environment:
      MQTT_HEALTH_PASSWORD: ${MQTT_HEALTH_PASSWORD}
    restart: unless-stopped
    networks:
      - flowwatch
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/uptime' -C 1 -u health -P $${MQTT_HEALTH_PASSWORD} -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Data Router ──────────────────────────────────────────────────────────
  # ARCHITECTURE.md §1: routes MQTT → InfluxDB/MySQL, exposes HTTP endpoints
  nodered:
    image: nodered/node-red:latest
    container_name: flowwatch-nodered
    ports:
      - "1880:1880"
    volumes:
      - ./nodered/data:/data
    environment:
      - TZ=UTC
      # Credentials injected into node configs via ${VAR} (kept out of commits)
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_NODERED_USERNAME=nodered
      - MQTT_NODERED_PASSWORD=${MQTT_NODERED_PASSWORD}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_healthy
      influxdb-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - flowwatch

  # ── Time-Series Store ────────────────────────────────────────────────────
  # SCHEMA.md §2: sensor readings (ultrasonic, waterlevel)
  influxdb:
    image: influxdb:2
    container_name: flowwatch-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    restart: unless-stopped
    networks:
      - flowwatch
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── One-shot: ensure per-unit buckets exist ─────────────────────────────
  # SCHEMA.md §2: one bucket per unit (flowwatch_{unit_id}). influxdb:2's
  # DOCKER_INFLUXDB_INIT_BUCKET creates only one bucket on a fresh volume and
  # skips setup (incl. /docker-entrypoint-initdb.d) once the bolt file exists.
  # This service guarantees flowwatch_unit2 exists idempotently, on fresh AND
  # pre-existing volumes; Node-RED waits for it via depends_on.
  influxdb-init:
    image: influxdb:2
    container_name: flowwatch-influxdb-init
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN}
    command: |
      /bin/sh -c 'if influx bucket list --org "$$INFLUXDB_ORG" --token "$$INFLUXDB_ADMIN_TOKEN" --host http://influxdb:8086 | grep -q flowwatch_unit2; then echo "flowwatch_unit2 bucket already exists"; else influx bucket create --org "$$INFLUXDB_ORG" --name flowwatch_unit2 --token "$$INFLUXDB_ADMIN_TOKEN" --host http://influxdb:8086; fi'
    restart: "no"
    networks:
      - flowwatch

  # ── Event Store ──────────────────────────────────────────────────────────
  # SCHEMA.md §3: discrete events (blockage_detected, cycle_complete, etc.)
  mysql:
    image: mysql:8
    container_name: flowwatch-mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    restart: unless-stopped
    networks:
      - flowwatch
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  influxdb_config:
  mysql_data:

networks:
  flowwatch:
    driver: bridge
